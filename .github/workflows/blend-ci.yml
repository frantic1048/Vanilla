name: Blend CI

on:
  push:
    branches: [master]
    paths:
      - "blend/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/blend-ci.yml"
  pull_request:
    paths:
      - "blend/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/blend-ci.yml"

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: blend
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: step-security/rust-cache@851174d9a2fdc03e0896e02844dcc61d81dd7851 # v2.9.1
        with:
          workspaces: blend
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test
      - run: cargo run -- check
      - run: cargo run -- format --check
