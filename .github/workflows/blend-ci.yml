name: Blend CI

on:
  push:
    branches: [master]
    paths:
      - "blend/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/blend-ci.yml"
  pull_request:
    paths:
      - "blend/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/blend-ci.yml"

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: blend
    steps:
      - name: Harden the runner (Block unapproved outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            index.crates.io:443
            static.crates.io:443
            static.rust-lang.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: step-security/rust-cache@851174d9a2fdc03e0896e02844dcc61d81dd7851 # v2.9.1
        with:
          workspaces: blend
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test
      - run: cargo run -- check
      - run: cargo run -- format --check
