name: Orders CI

on:
  push:
    branches: [master]
    paths:
      - "orders/**"
      - ".github/workflows/orders-ci.yml"
  pull_request:
    paths:
      - "orders/**"
      - ".github/workflows/orders-ci.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/frantic1048/blend:0.2.13@sha256:e022633367f3738a8956da79d83d8aae45aa37e5cd69ab762a25c939d5a2033e
    steps:
      - name: Harden the runner (Block unapproved outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: blend --version

      - name: Check orders
        run: blend check

      - name: Check order formatting
        run: blend format --check
