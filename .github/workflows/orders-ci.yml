name: Orders CI

on:
  push:
    branches: [master]
    paths:
      - "orders/**"
      - ".github/workflows/orders-ci.yml"
  pull_request:
    paths:
      - "orders/**"
      - ".github/workflows/orders-ci.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/frantic1048/blend:0.3.4@sha256:8aea8ad7fab9c5682d9958ae32d03f17b7c2cfab8436ee41ac2912f603480b1f
    steps:
      - name: Harden the runner (Block unapproved outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: blend --version

      - name: Check orders
        run: blend check

      - name: Check order formatting
        run: blend format --check
