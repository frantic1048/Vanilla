[package]
name = "blend"
version = "0.2.15"
edition = "2024"
authors = ["kafuuchino"]
repository = "https://github.com/frantic1048/Vanilla"

[dependencies]
clap = { version = "4", features = ["derive"] }
walkdir = "2"
globset = "0.4"
console = "0.16"

# Nickel DSL
nickel-lang = "=2.2.0"
nickel-lang-core = { version = "=0.18.0", default-features = false, features = ["format"] }
nickel-lang-parser = "=0.3.0"
codespan = "0.13"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "=1.1.0"
toml = "1.0"
indexmap = { version = "2", features = ["serde"] }
json-strip-comments = "3"

# Diff
similar = "3"
regex = "1"

# System info
hostname = "0.4"
libc = "0.2"

# Parallelism
rayon = "1"

# Tree-sitter (CST structural parsing)
tree-sitter = "0.26"
tree-sitter-nickel = "0.5"

# Error handling
thiserror = "2"
anyhow = "1"

[dev-dependencies]
tempfile = "=3.27.0"
rexpect = "=0.7.1"
